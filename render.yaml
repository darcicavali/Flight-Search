# Render blueprint — see https://render.com/docs/blueprint-spec
# Deploy: in Render dashboard, "New +" → "Blueprint" → pick this repo.
# Render reads this file and creates the service.

services:
  - type: web
    name: flight-search
    runtime: python
    plan: free
    region: oregon
    branch: claude/flight-search-ranking-a8bt1
    buildCommand: pip install -r requirements.txt
    # 1 worker + 1 thread on free tier (512MB). A second in-flight request
    # would double LetsFG's per-search memory and OOM. If you upgrade the
    # plan later, bump --threads up to 2 for a snappier feel.
    # 300s timeout covers 4–5 legs sequentially (up to ~1 min each) + the
    # slowest browser-fallback path.
    startCommand: gunicorn tools.web:app --bind 0.0.0.0:$PORT --workers 1 --threads 1 --timeout 300 --access-logfile -
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Skip browser connectors — same setting CI uses.
      - key: LETSFG_BROWSERS
        value: "0"
      # Default username for HTTP Basic auth. Override in Render dashboard if you want.
      - key: WEB_USERNAME
        value: "user"
      # Password — set this in Render dashboard (sync: false means Render
      # prompts you, value isn't stored in this file).
      - key: WEB_PASSWORD
        sync: false
      # Optional: set in Render dashboard to enable award search via seats.aero.
      - key: SEATS_AERO_API_KEY
        sync: false
