trips:

  # ============================================================================
  # WHERE YOUR REAL TRIPS LIVE
  # ============================================================================
  # The trips defined in this file are public — anyone with access to the repo
  # can read them. Keep your *actual* trip dates, destinations, and points
  # balances out of this file by putting them in the **TRIPS_CONFIG** GitHub
  # Secret instead. main.py merges secret trips on top of file trips at
  # runtime, with the secret taking precedence.
  #
  # See docs/ADDING_A_TRIP.md for the full guide.
  # ============================================================================

  # Smoke-test trip — generic example, runs ~10 min when dispatched manually.
  # Not included in the daily email (enabled: false). Safe to leave public.
  chicago_sao_paulo_smoke:
    name: "SMOKE — sample trip (1 date, 1 stopover)"
    enabled: false
    origin: "ORD"
    final_destination: "GRU"
    brazil_gateways: ["GRU"]

    stopovers:
      candidates: ["AUA"]
      min_days: 3
      max_days: 3

    through_tickets:
      enabled: true

    domestic_leg:
      origin: "GRU"
      destinations: ["FLN", "NVT"]
      airlines: ["LATAM", "GOL", "AZUL"]

    travel_window:
      earliest_depart: "2026-07-16"
      latest_depart: "2026-07-16"
      return_by: "2026-08-10"

    points_balances:
      amex_mr: 0
      lifemiles: 0
      c6_atomos: 0

    cpp_valuations:
      lifemiles: 1.4
      aeroplan: 1.8
      united_mp: 1.2
      flying_blue: 1.5
      smiles: 1.3
      latam_pass: 1.2
      tudoazul: 1.1

    scoring_weights:
      total_cost: 0.5
      total_time: 0.3
      connection_quality: 0.2

    constraints:
      gru_min_connection_hours: 3
      max_total_travel_hours: 36
      baggage_checked_bags: 1

    notify:
      email: ""
      send_time: "07:00"
      only_if_change: false
