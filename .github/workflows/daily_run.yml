name: Daily Flight Digest

on:
  # Scheduled runs disabled until smoke-test passes on CI. Re-enable by
  # uncommenting the two lines below.
  # schedule:
  #   - cron: '0 13 * * *'   # 13:00 UTC ≈ 07:00 CT (adjust for DST twice a year)
  workflow_dispatch:
    inputs:
      trip:
        description: "Trip key from config/trips.yaml"
        required: true
        default: "chicago_sao_paulo_jul2026"
        type: choice
        options:
          - chicago_sao_paulo_smoke
          - chicago_sao_paulo_jul2026

jobs:
  run-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers (required by LetsFG)
        run: python -m playwright install --with-deps chromium

      - name: Run flight search
        env:
          # Skip LetsFG's browser-based connectors — they take 20–60s each on
          # GH runners (headed Chrome, slow renders, bot checks) and rarely
          # add unique offers. API-only connectors (Kiwi aggregator + direct
          # airline APIs) give us full coverage in seconds per leg.
          LETSFG_BROWSERS: "0"
          SEATS_AERO_API_KEY: ${{ secrets.SEATS_AERO_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
        run: python main.py --trip "${{ github.event.inputs.trip || 'chicago_sao_paulo_jul2026' }}"

      - name: Commit price history snapshot
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/price_history.json || true
          git diff --staged --quiet || git commit -m "Price snapshot $(date +%Y-%m-%d)"
          git push || true
