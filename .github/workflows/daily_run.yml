name: Daily Flight Digest

on:
  schedule:
    - cron: '0 13 * * *'   # 13:00 UTC ≈ 07:00 CT (adjust for DST twice a year)
  workflow_dispatch:
    inputs:
      trip:
        description: "Which trip to run. 'all' = every trip with enabled:true in trips.yaml (matches the scheduled behavior). Pick a specific key to run just that trip."
        required: true
        default: "all"
        type: choice
        options:
          - all
          - chicago_sao_paulo_smoke
          - chicago_sao_paulo_jul2026

jobs:
  run-digest:
    runs-on: ubuntu-latest
    # No "contents: write" needed — price_history is now persisted via the
    # Actions cache, not committed back to the repo. This also means the
    # repo can be safely public without exposing tracked routes/dates.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers (required by LetsFG)
        run: python -m playwright install --with-deps chromium

      - name: Install Xvfb (for headed Chrome in browser-based connectors)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Restore price history from previous run. Cache content is encrypted
      # and stays private even on public repos, so tracked routes/dates
      # don't leak. Cache key includes the date so each daily run gets a
      # fresh save_path while still being able to restore from the most
      # recent prior cache.
      - name: Restore price history cache
        uses: actions/cache@v4
        with:
          path: data/price_history.json
          key: price-history-${{ github.run_id }}
          restore-keys: |
            price-history-

      - name: Run flight search
        env:
          # Enable LetsFG's browser-based connectors. GitHub Actions runners
          # ship with Chrome at /opt/google/chrome and 7GB RAM, so we can
          # afford the slower scrapes (~30–60s per leg) in exchange for Copa
          # (via PTY), Avianca (via BOG), LATAM, and the US legacy carriers'
          # NDC inventory — fares Kiwi alone misses. xvfb-run gives the headed
          # Chrome a virtual display.
          LETSFG_BROWSERS: "1"
          # User's actual trip configs (dates, destinations, points balances).
          # Stored as a single multi-line YAML string in the GitHub Secret so
          # the public repo's config/trips.yaml can stay generic. main.py
          # merges this on top of the file at runtime.
          TRIPS_CONFIG: ${{ secrets.TRIPS_CONFIG }}
          SEATS_AERO_API_KEY: ${{ secrets.SEATS_AERO_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
        # Scheduled runs and dispatch-with-"all" both run every enabled trip.
        # Dispatch with a specific trip name runs just that one.
        timeout-minutes: 90
        run: |
          TRIP="${{ github.event.inputs.trip }}"
          if [ -z "$TRIP" ] || [ "$TRIP" = "all" ]; then
            xvfb-run --auto-servernum python main.py
          else
            xvfb-run --auto-servernum python main.py --trip "$TRIP"
          fi
